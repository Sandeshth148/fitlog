<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<!-- lang="en" → used by screen readers & SEO

dir="ltr" → can be toggled for RTL (Arabic, etc.) -->

<head>
  <!-- Meta Tags for Performance, SEO, Accessibility -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="description" content="FitLog - Personal weight and health tracker" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <title>FitLog: Your Personal Weight Tracker</title>
  <!-- Always use a meaningful, dynamic title — later we can inject titles per route using Title service. -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />

  <!-- 💡 What it does:

  rel="preconnect" tells the browser to start DNS + TCP connection early for faster font loading. It’s a web performance
  optimization to reduce delay. -->
</head>

<body>
  <app-root></app-root>
</body>

</html>
