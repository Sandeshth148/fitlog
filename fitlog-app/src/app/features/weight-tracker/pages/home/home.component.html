<section class="fitlog-container">
  <header class="fitlog-header">
    <h1>Welcome to FitLog</h1>
    <button (click)="toggleTheme()" aria-label="Toggle light or dark theme">
      Toggle Theme
    </button>
  </header>

  <main class="fitlog-main">
    <p>Your personal weight tracking assistant.</p>
    <button class="fab" aria-label="Add a new weight entry">
      + Add Entry
    </button>
  </main>
</section>
